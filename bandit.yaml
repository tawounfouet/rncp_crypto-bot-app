# Bandit configuration
# https://bandit.readthedocs.io/en/latest/config.html

# Skip assert checks in test files
assert_used:
  skips: ['*_test.py', '*test_*.py', 'test_*.py']

# Exclude test directories from scanning
exclude_dirs:
  - backend/src/tests
  - frontend/src/tests

# Skip specific checks that generate false positives
skips: []
