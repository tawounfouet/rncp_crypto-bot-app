[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dst-crypto-bot-models-training"
version = "0.1.0"
description = "MVP Data Engineering and ML training pipeline for CryptoBot v2"
requires-python = ">=3.11"

# Les dependances runtime sont declarees dans requirements.txt uniquement
# (source de verite, generee depuis versions.env via requirements.txt.template).
# Ce pyproject ne porte que le metadata de build + la config outils. Garder les
# versions de scikit-learn / joblib alignees avec le backend (inference) via
# versions.env : SCIKIT_LEARN_VERSION / JOBLIB_VERSION — compat train<->inference.

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
