# Docker Compose pour environnement de DEVELOPPEMENT
# ===================================================
# IMPORTANT : ne pas lancer directement avec "docker compose up".
# Utiliser le Makefile qui charge automatiquement versions.env :
#   make dev-up       Demarrer
#   make dev-down     Arreter
#   make dev-logs     Suivre les logs
#   make dev-config   Valider la configuration

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestration/Dockerfile
    args:
      AIRFLOW_IMAGE: ${AIRFLOW_IMAGE}
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PWD:-postgres}@postgres:5432/airflow
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY}
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PWD=${POSTGRES_PWD:-postgres}
    # MinIO — requis par les jobs d'ingestion
    - MINIO_ENDPOINT=minio:9000
    - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
    - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    - MINIO_SECURE=0
    - MINIO_BUCKET=crypto-bot-data
    - BINANCE_BASE_URL=https://api.binance.com
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    # Volume nommé (pas un bind-mount) : Docker gère l'ownership pour l'user
    # airflow (UID 50000) -> évite le "Permission denied" sur un dossier hôte
    # créé en root. Logs consultables via `docker compose logs` ou l'UI Airflow.
    - airflow_logs:/opt/airflow/logs
    - ./orchestration/plugins:/opt/airflow/plugins
    - ./jobs:/opt/airflow/jobs       # jobs batch importés par les DAGs
    - ./data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - dev-network

services:
  # PostgreSQL
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PWD:-postgres}
      POSTGRES_DB: crypto_bot_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      # Vérifie aussi que les bases créées par init-user-db.sh existent : pg_isready
      # seul passe via le socket DÈS la phase d'init (avant CREATE DATABASE airflow),
      # ce qui faisait démarrer airflow-init trop tôt -> "database airflow does not exist".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -q && psql -U ${POSTGRES_USER:-postgres} -d airflow -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev-network

  # PostgreSQL Admin UI
  adminer:
    image: ${ADMINER_IMAGE}
    container_name: postgres-admin-ui
    restart: always
    ports:
      - "8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  # MinIO (S3-compatible storage)
  minio:
    image: ${MINIO_IMAGE}
    container_name: minio-s3-service
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER_ADMIN:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PWD_ADMIN:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - dev-network

  # MinIO bucket creation (one-time)
  createbuckets:
    image: ${MINIO_MC_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/crypto-bot-data;
      /usr/bin/mc anonymous set download myminio/crypto-bot-data;
      echo 'Buckets created successfully.';
      exit 0;
      "
    profiles:
      - tools
    networks:
      - dev-network

  # Backend FastAPI
  crypto-bot-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: crypto-bot-backend
    restart: always
    ports:
      - "8009:8009"
    volumes:
      - ./backend/src:/app/src
      - ./data:/app/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PWD:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=crypto_bot_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=0
      - MINIO_BUCKET=crypto-bot-data
      - ENVIRONMENT=development
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dev-network

  # Frontend Streamlit
  crypto-bot-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: crypto-bot-frontend
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - API_URL=http://crypto-bot-backend:8009
      - ENVIRONMENT=development
      - APP_VERSION=${APP_VERSION:-dev}
    depends_on:
      crypto-bot-backend:
        condition: service_healthy
    networks:
      - dev-network

  # Airflow Services
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: version
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e   # échec bruyant : si `airflow db init` plante, ne pas sortir en exit 0
        airflow db init
        airflow connections delete postgres_default || true
        airflow connections add 'postgres_default' \
          --conn-type 'postgres' \
          --conn-host 'postgres' \
          --conn-port '5432' \
          --conn-login '${POSTGRES_USER:-postgres}' \
          --conn-password '${POSTGRES_PWD:-postgres}' \
          --conn-schema 'crypto_bot_db'
        airflow users create \
          --username '${AIRFLOW_ADMIN_USER:-admin}' \
          --firstname Crypto \
          --lastname Admin \
          --role Admin \
          --email admin@cryptobot.local \
          --password '${AIRFLOW_ADMIN_PASSWORD:-admin}' || true

  # Service de prédiction ML (FastAPI)
  crypto-bot-ml-api:
    build:
      context: ./models
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: crypto-bot-ml-api
    restart: always
    ports:
      - "8010:8010"
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/artifacts
      - ./models/logs:/app/logs
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - MLFLOW_TRACKING_URI=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PWD:-postgres}@postgres:5432/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dev-network

  # Interface utilisateur MLflow
  mlflow-ui:
    build:
      context: ./models
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: mlflow-ui
    restart: always
    ports:
      - "5001:5001"
    volumes:
      - ./models/artifacts:/app/artifacts
    command: python -m mlflow ui --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PWD:-postgres}@postgres:5432/mlflow --host 0.0.0.0 --port 5001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-network

volumes:
  postgres_data:
  minio_data:
  airflow_logs:

networks:
  dev-network:
    name: dev-network
