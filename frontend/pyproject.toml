[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-bot-frontend"
version = "0.1.0"
description = "Frontend Streamlit mocke pour le MVP Crypto Bot"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.45,<2.0",
  "plotly>=5.24,<6.0",
  "pandas>=2.3,<3.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
  "black>=24.8,<26.0",
  "mypy>=1.11,<2.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = "%TEMP%/crypto-bot-app-pytest-cache"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/"]
