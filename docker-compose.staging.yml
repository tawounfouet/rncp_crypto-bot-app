# Docker Compose pour environnement STAGING
# ==========================================
# IMPORTANT : ne pas lancer directement avec "docker compose".
# Utiliser : make staging-up / make staging-down / make staging-config
# Ports (staging = memes valeurs que dev ; prod = staging+1, cf. docker-compose.prod.yml) :
# Backend 8009, Postgres 5434, MinIO API 9000 / Console 9010, Adminer 8085,
# Frontend 8501, ml-api 8020, mlflow-ui 5001, Airflow 8080

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: staging-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PWD:-postgres}
      POSTGRES_DB: crypto_bot_db
    ports:
      - "5434:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - staging-network

  # PostgreSQL Admin UI
  adminer:
    image: ${ADMINER_IMAGE}
    container_name: staging-postgres-admin-ui
    restart: always
    ports:
      - "8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging-network

  minio:
    image: ${MINIO_IMAGE}
    container_name: staging-minio
    restart: always
    ports:
      - "9000:9000"
      - "9010:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - staging_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - staging-network

  # MinIO bucket creation (one-time)
  createbuckets:
    image: ${MINIO_MC_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/crypto-bot-data;
      /usr/bin/mc anonymous set download myminio/crypto-bot-data;
      echo 'Buckets created successfully.';
      exit 0;
      "
    profiles:
      - tools
    networks:
      - staging-network

  crypto-bot-backend:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/dst_crypto/crypto-bot-app}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: staging-backend
    restart: always
    ports:
      - "8009:8009"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PWD:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=crypto_bot_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=0
      - MINIO_BUCKET=crypto-bot-data
      - AIRFLOW_API_URL=http://airflow-webserver:8080
      - AIRFLOW_ADMIN_USER=${AIRFLOW_ADMIN_USER:-admin}
      - AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:-admin}
      - ENVIRONMENT=staging
      - DEBUG=true
      - APP_VERSION=${APP_VERSION:-staging}
      - EXCHANGE_ENC_KEY=${EXCHANGE_ENC_KEY}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Sans cette dependance, backend demarre en parallele de ml-api (image plus
      # lourde, plus longue a devenir healthy) : le sync des templates ML au demarrage
      # (sync_builtin_templates(), one-shot) tente alors de contacter ml-api trop tot et
      # echoue silencieusement (Connection refused) -- catalogue de bots vide jusqu'au
      # prochain redemarrage du backend. Observe en conditions reelles le 2026-08-28.
      crypto-bot-ml-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - staging-network

  crypto-bot-frontend:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/dst_crypto/crypto-bot-app}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: staging-frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://crypto-bot-backend:8009
      - ENVIRONMENT=staging
      - APP_VERSION=${APP_VERSION:-staging}
    depends_on:
      crypto-bot-backend:
        condition: service_healthy
    networks:
      - staging-network

  # Service de prediction ML (FastAPI)
  crypto-bot-ml-api:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/dst_crypto/crypto-bot-app}/ml-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: models/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: staging-ml-api
    restart: always
    ports:
      - "8020:8010"
    volumes:
      - ./models/artifacts:/app/artifacts
      - ./models/logs:/app/logs
    environment:
      - ENVIRONMENT=staging
      - DEBUG=false
      - MLFLOW_TRACKING_URI=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PWD:-postgres}@postgres:5432/mlflow
      # MinIO — requis par build_symbol_features (lecture des OHLCV bruts ingérés par Airflow)
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=0
      - MINIO_BUCKET=crypto-bot-data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - staging-network

  # Interface utilisateur MLflow (meme image que crypto-bot-ml-api, commande differente)
  mlflow-ui:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/dst_crypto/crypto-bot-app}/ml-api:${IMAGE_TAG:-latest}
    container_name: staging-mlflow-ui
    restart: always
    mem_limit: 1g
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # CORS (protection distincte de --allowed-hosts ci-dessous, cf. commentaire) --
      # lu directement dans l'environnement du process mlflow, pas via un flag CLI :
      # doit donc etre declare ici pour etre transmis au conteneur, sinon .env.staging
      # a beau avoir la bonne valeur, le process mlflow ne la voit jamais.
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "${MLFLOW_SERVER_CORS_ALLOWED_ORIGINS:-}"
    ports:
      - "5001:5001"
    volumes:
      - ./models/artifacts:/app/artifacts
    command: python -m mlflow ui --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PWD:-postgres}@postgres:5432/mlflow --host 0.0.0.0 --port 5001 --allowed-hosts "${MLFLOW_SERVER_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}" --workers 1
    # Le HEALTHCHECK de l'image cible le port 8010 (crypto-bot-ml-api) : ce service
    # tourne sur 5001 (mlflow ui), d'ou ce healthcheck dedie.
    # --allowed-hosts : protection anti DNS-rebinding de MLflow >= 3.x, n'autorise par
    # defaut que localhost/IP privees -- MLFLOW_SERVER_ALLOWED_HOSTS (.env.staging) doit
    # inclure l'IP publique de la VM (SANS oublier ":*" pour le port, sinon comparaison
    # exacte qui echoue -- cf. is_allowed_host_header dans mlflow/server/security_utils.py),
    # ex. MLFLOW_SERVER_ALLOWED_HOSTS=localhost:*,127.0.0.1:*,<IP_PUBLIQUE_VM>:*
    #
    # MLFLOW_SERVER_CORS_ALLOWED_ORIGINS : protection SEPAREE, bloque les requetes POST/PUT/
    # DELETE/PATCH cross-origin (ex. runs/search, logged-models/search -- la plupart des
    # appels de l'UI) sur la base de l'en-tete Origin, pas Host. Vide par defaut = tout
    # bloque sauf localhost. Format origine complete avec schema, wildcard sur le port
    # via fnmatch (cf. should_block_cors_request dans mlflow/server/security_utils.py),
    # ex. MLFLOW_SERVER_CORS_ALLOWED_ORIGINS=http://<IP_PUBLIQUE_VM>:*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging-network

  # Airflow (orchestration DAGs : ingestion, pipeline ML)
  airflow-webserver:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/dst_crypto/crypto-bot-app}/airflow:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: orchestration/Dockerfile
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE}
    container_name: staging-airflow-webserver
    restart: always
    command: webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - PYTHONPATH=/opt/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PWD:-postgres}@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY}
      # cf. docker-compose.yml pour le pourquoi (API REST Airflow, trigger de DAG depuis le backend)
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PWD:-postgres}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=0
      - MINIO_BUCKET=crypto-bot-data
      - BINANCE_BASE_URL=https://api.binance.com
    volumes:
      - staging_airflow_logs:/opt/airflow/logs
      # Bind-mounts des sources (meme pattern que dev docker-compose.yml) : Airflow doit
      # voir le code courant (DAGs USDC) et les artefacts entrenes par ml-api dans
      # models/artifacts -- sinon l'image autonome est figee (cf. deploy_model dans ml_pipeline).
      - ./orchestration/dags:/opt/airflow/dags
      - ./orchestration/plugins:/opt/airflow/plugins
      - ./jobs:/opt/airflow/jobs
      - ./models:/opt/airflow/models
      - ./utils:/opt/airflow/utils
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - staging-network

  airflow-scheduler:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/dst_crypto/crypto-bot-app}/airflow:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: orchestration/Dockerfile
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE}
    container_name: staging-airflow-scheduler
    restart: always
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - PYTHONPATH=/opt/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PWD:-postgres}@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY}
      # cf. docker-compose.yml pour le pourquoi (API REST Airflow, trigger de DAG depuis le backend)
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PWD:-postgres}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=0
      - MINIO_BUCKET=crypto-bot-data
      - BINANCE_BASE_URL=https://api.binance.com
    volumes:
      - staging_airflow_logs:/opt/airflow/logs
      # Bind-mounts des sources (meme pattern que dev docker-compose.yml) : Airflow doit
      # voir le code courant (DAGs USDC) et les artefacts entrenes par ml-api dans
      # models/artifacts -- sinon l'image autonome est figee (cf. deploy_model dans ml_pipeline).
      - ./orchestration/dags:/opt/airflow/dags
      - ./orchestration/plugins:/opt/airflow/plugins
      - ./jobs:/opt/airflow/jobs
      - ./models:/opt/airflow/models
      - ./utils:/opt/airflow/utils
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - staging-network

  airflow-init:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/dst_crypto/crypto-bot-app}/airflow:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: orchestration/Dockerfile
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE}
    container_name: staging-airflow-init
    command: version
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - PYTHONPATH=/opt/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PWD:-postgres}@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY}
      # cf. docker-compose.yml pour le pourquoi (API REST Airflow, trigger de DAG depuis le backend)
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        airflow db init
        airflow connections delete postgres_default || true
        airflow connections add 'postgres_default' \
          --conn-type 'postgres' \
          --conn-host 'postgres' \
          --conn-port '5432' \
          --conn-login '${POSTGRES_USER:-postgres}' \
          --conn-password '${POSTGRES_PWD:-postgres}' \
          --conn-schema 'crypto_bot_db'
        airflow users create \
          --username '${AIRFLOW_ADMIN_USER:-admin}' \
          --firstname Crypto \
          --lastname Admin \
          --role Admin \
          --email admin@cryptobot.local \
          --password '${AIRFLOW_ADMIN_PASSWORD:-admin}' || true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging-network

volumes:
  staging_postgres_data:
  staging_minio_data:
  staging_airflow_logs:

networks:
  staging-network:
    name: staging-network
