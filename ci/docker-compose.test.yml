# Docker Compose pour les tests d'integration en CI
# ==================================================
# Utilise l'image backend buildee (${IMAGE_TAG}) avec de vrais services
# PostgreSQL et MongoDB pour tester les migrations et connexions.
#
# Usage CI :
#   IMAGE_TAG="$IMAGE" docker compose --env-file versions.env -f ci/docker-compose.test.yml up \
#     --abort-on-container-exit --exit-code-from test-runner

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: crypto_bot_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  mongo:
    image: ${MONGO_IMAGE}
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo mongodb://test:test@localhost:27017/admin --quiet
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  test-runner:
    image: ${IMAGE_TAG}
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=test
      - POSTGRES_PWD=test
      - POSTGRES_DB=crypto_bot_test
      - MONGODB_HOST=mongo
      - MONGODB_PORT=27017
      - MONGODB_USER=test
      - MONGODB_PWD=test
      - MINIO_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=test
      - MINIO_SECRET_KEY=test
      - MINIO_SECURE=0
      - MINIO_BUCKET=test-bucket
      - ENVIRONMENT=test
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./test-results:/tmp/test-results
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/test-results &&
        echo '=== Running tests ===' &&
        pytest src/tests -v --junitxml=/tmp/test-results/report.xml --cov=src --cov-report=term-missing --cov-report=xml:/tmp/test-results/coverage.xml ;
        TEST_EXIT=$$? ;
        echo '=== Generating report ===' &&
        python /app/ci/parse_test_report.py /tmp/test-results/report.xml /tmp/test-results/test_report.txt || echo 'WARN: report generation failed (non-blocking)' ;
        exit $$TEST_EXIT
    networks:
      - test-network

networks:
  test-network:
    name: test-network
