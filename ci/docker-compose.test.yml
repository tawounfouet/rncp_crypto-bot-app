# Docker Compose pour les tests d'integration en CI
# ==================================================
# Utilise l'image backend buildee (${IMAGE_TAG}) avec un vrai service
# PostgreSQL pour tester les migrations et connexions.
#
# Usage CI :
#   IMAGE_TAG="$IMAGE" docker compose --env-file versions.env -f ci/docker-compose.test.yml up \
#     --abort-on-container-exit --exit-code-from test-runner

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: crypto_bot_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  test-runner:
    image: ${IMAGE_TAG}
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=test
      - POSTGRES_PWD=test
      - POSTGRES_DB=crypto_bot_test
      - MINIO_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=test
      - MINIO_SECRET_KEY=test
      - MINIO_SECURE=0
      - MINIO_BUCKET=test-bucket
      - ENVIRONMENT=test
      - DEBUG=true
      - JWT_SIGNING_KEY=test-jwt-signing-key-not-for-production
      - CORS_ORIGINS=http://localhost:8501
      - ALLOWED_HOSTS=localhost,127.0.0.1,crypto-bot-backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./test-results:/tmp/test-results
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/test-results &&
        echo '=== Running tests ===' &&
        pytest tests -v --junitxml=/tmp/test-results/report.xml --cov=src --cov-report=term-missing --cov-report=xml:/tmp/test-results/coverage.xml ;
        TEST_EXIT=$$? ;
        echo '=== Generating report ===' &&
        python /app/ci/parse_test_report.py /tmp/test-results/report.xml /tmp/test-results/test_report.txt || echo 'WARN: report generation failed (non-blocking)' ;
        exit $$TEST_EXIT
    networks:
      - test-network

networks:
  test-network:
    name: test-network
