# GitLab CI/CD Pipeline - Crypto-Bot App (Monorepo)
# =================================================
# Pipeline : lint → test → build → deploy
#
# Workflow :
#   Staging  : MR feature/* → staging (CI vert, pas d'approbation)
#   Prod     : MR staging → main (review + approbation) → tag vX.X
#
# Variables requises (GitLab > Crypto-bot-app > Settings > CI/CD > Variables) :
#   GROUP_PAT_TOKEN : PAT avec scope write_repository sur le groupe dst_crypto
#   SSH_PRIVATE_KEY, VM_HOST, SSH_USER : pour deploy VM AWS

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.11"

# ------------------------------
# CACHE & TEMPLATES
# ------------------------------

.python_cache: &python_cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-pip
    paths:
      - .cache/pip
      - venv/

.python_job:
  image: python:${PYTHON_VERSION}
  <<: *python_cache
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --cache-dir .cache/pip -r backend/requirements-dev.txt

.deploy_template:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl git
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts 2>/dev/null


# ============================================
# STAGE: LINT
# ============================================

lint:dockerfile:backend:
  stage: lint
  image: hadolint/hadolint:latest-debian
  script:
    - echo "Verification bonnes pratiques Dockerfile backend..."
    - hadolint backend/Dockerfile
    - echo "Dockerfile backend OK"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^dev_/
  allow_failure: true

lint:dockerfile:frontend:
  stage: lint
  image: hadolint/hadolint:latest-debian
  script:
    - echo "Verification bonnes pratiques Dockerfile frontend..."
    - hadolint frontend/Dockerfile
    - echo "Dockerfile frontend OK"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^dev_/
  allow_failure: true

semgrep_sast:
  stage: lint
  image: semgrep/semgrep:latest
  script:
    - echo "Scan SAST Semgrep (Python)..."
    - semgrep --config .semgrep/security.yml backend/src/ frontend/src/ --error --no-git-ignore
    - echo "Aucune faille de securite detectee"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^dev_/
  allow_failure: false


# ============================================
# STAGE: TEST
# ============================================

check:backend:
  extends: .python_job
  stage: test
  variables:
    PYTHONPATH: "${CI_PROJECT_DIR}/backend"
  script:
    - flake8 backend/src/ --max-line-length=120 --statistics --exclude=tests
    - black --check backend/src/ --exclude='tests/'
    - cd backend
    - pytest src/tests -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^dev_/
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/

lint:frontend:
  image: python:${PYTHON_VERSION}
  stage: test
  script:
    - pip install flake8==7.2.0 black==26.1.0
    - flake8 frontend/src/ --max-line-length=120 --statistics --exclude=tests
    - black --check frontend/src/ --exclude='tests/'
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^dev_/
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/


# ============================================
# STAGE: BUILD
# ============================================

build:docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      # Determiner les tags a push
      # staging  → :staging + :latest
      # tag vX.X → :vX.X + :production + :latest
      # autre    → :latest uniquement
      TAGS_BACKEND=""
      TAGS_FRONTEND=""

      if [ -n "$CI_COMMIT_TAG" ]; then
        FRONTEND_VERSION="$CI_COMMIT_TAG"
        TAGS_BACKEND="$CI_COMMIT_TAG production latest"
        TAGS_FRONTEND="$CI_COMMIT_TAG production latest"
      elif [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        FRONTEND_VERSION="staging"
        TAGS_BACKEND="staging latest"
        TAGS_FRONTEND="staging latest"
      else
        FRONTEND_VERSION="dev"
        TAGS_BACKEND="latest"
        TAGS_FRONTEND="latest"
      fi

      # Build backend
      echo "Building backend image..."
      docker build -t $CI_REGISTRY_IMAGE/backend:build ./backend
      for TAG in $TAGS_BACKEND; do
        docker tag $CI_REGISTRY_IMAGE/backend:build $CI_REGISTRY_IMAGE/backend:$TAG
        docker push $CI_REGISTRY_IMAGE/backend:$TAG
        echo "  pushed backend:$TAG"
      done

      # Build frontend
      echo "Building frontend image (APP_VERSION=$FRONTEND_VERSION)..."
      docker build --build-arg APP_VERSION=$FRONTEND_VERSION -t $CI_REGISTRY_IMAGE/frontend:build ./frontend
      for TAG in $TAGS_FRONTEND; do
        docker tag $CI_REGISTRY_IMAGE/frontend:build $CI_REGISTRY_IMAGE/frontend:$TAG
        docker push $CI_REGISTRY_IMAGE/frontend:$TAG
        echo "  pushed frontend:$TAG"
      done

  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/

scan:images:
  stage: build
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - job: build:docker
      artifacts: false
  script:
    - |
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

      for COMPONENT in backend frontend; do
        if [ -n "$CI_COMMIT_TAG" ]; then
          IMAGE_TAG="$CI_COMMIT_TAG"
        elif [ "$CI_COMMIT_BRANCH" = "staging" ]; then
          IMAGE_TAG="staging"
        else
          IMAGE_TAG="latest"
        fi

        IMAGE="$CI_REGISTRY_IMAGE/${COMPONENT}:${IMAGE_TAG}"
        echo "=== Scan de vulnerabilites sur $IMAGE ==="

        # Rapport informatif (LOW/MEDIUM/HIGH)
        trivy image --exit-code 0 --severity LOW,MEDIUM,HIGH --no-progress "$IMAGE"

        echo ""
        echo "=== Verification CVE CRITICAL (bloquant) ==="
        trivy image --exit-code 1 --severity CRITICAL --no-progress "$IMAGE"
        echo "Aucune CVE critique detectee pour $COMPONENT"
        echo ""
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/
  allow_failure: false


# ============================================
# STAGE: DEPLOY STAGING (VM AWS)
# ============================================

deploy:staging:
  extends: .deploy_template
  environment:
    name: staging
    url: http://$VM_HOST:8009
    on_stop: stop:staging
  script:
    - |
      # Config git pour les tags
      git config --global user.email "ci@crypto-bot.gitlab.com"
      git config --global user.name "GitLab CI"

      # Calculer le prochain numero RC
      git fetch --tags
      LAST_RC=$(git tag -l "v1.0-rc*" | sort -V | tail -1 | grep -oE '[0-9]+$' || echo "0")
      NEXT_RC=$((LAST_RC + 1))
      VERSION="v1.0-rc${NEXT_RC}"
      echo "=== Deploying version: $VERSION ==="

      # Creer le tag RC
      git tag -a "$VERSION" -m "Release candidate $VERSION (staging)"
      git push origin "$VERSION" || echo "Tag already exists or push failed"
    - |
      VERSION=$(git tag -l "v1.0-rc*" | sort -V | tail -1)
      ssh $SSH_USER@$VM_HOST << ENDSSH
        cd /opt/crypto-bot-staging

        echo "=== Pulling latest code ==="
        git fetch origin staging --tags
        git checkout staging
        git reset --hard origin/staging

        echo "=== Version: $VERSION ==="

        echo "=== Loading environment ==="
        cp .env.staging .env 2>/dev/null || true
        echo "APP_VERSION=$VERSION" >> .env

        echo "=== Login to registry ==="
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

        echo "=== Pulling images from registry ==="
        export IMAGE_TAG=staging
        docker compose -f docker-compose.staging.yml pull

        echo "=== Deploying ==="
        docker compose -f docker-compose.staging.yml down
        docker compose -f docker-compose.staging.yml up -d

        echo "=== Waiting for services ==="
        sleep 30
        docker compose -f docker-compose.staging.yml ps

        echo "=== Health check ==="
        curl -f http://localhost:8009/health || exit 1

        echo "=== Staging deployment $VERSION successful! ==="
      ENDSSH
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  when: on_success

stop:staging:
  extends: .deploy_template
  environment:
    name: staging
    action: stop
  script:
    - ssh $SSH_USER@$VM_HOST "cd /opt/crypto-bot-staging && docker compose -f docker-compose.staging.yml down"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  when: manual


# ============================================
# STAGE: DEPLOY PRODUCTION (VM AWS)
# ============================================

deploy:production:
  extends: .deploy_template
  environment:
    name: production
    url: http://$VM_HOST:9009
    on_stop: stop:production
  script:
    - |
      echo "=== Deploying tag $CI_COMMIT_TAG to production ==="
      ssh $SSH_USER@$VM_HOST << ENDSSH
        cd /opt/crypto-bot-prod

        echo "=== Fetching tag $CI_COMMIT_TAG ==="
        git fetch origin --tags
        git checkout $CI_COMMIT_TAG

        echo "=== Loading environment ==="
        cp .env.production .env 2>/dev/null || true
        echo "APP_VERSION=$CI_COMMIT_TAG" >> .env

        echo "=== Backup database ==="
        docker exec prod-postgres pg_dump -U postgres crypto_bot_db > /tmp/backup_prod_\$(date +%Y%m%d_%H%M%S).sql 2>/dev/null || true

        echo "=== Login to registry ==="
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

        echo "=== Pulling images from registry ==="
        export IMAGE_TAG=$CI_COMMIT_TAG
        docker compose -f docker-compose.prod.yml pull

        echo "=== Deploying ==="
        docker compose -f docker-compose.prod.yml down
        docker compose -f docker-compose.prod.yml up -d

        echo "=== Waiting for services ==="
        sleep 30
        docker compose -f docker-compose.prod.yml ps

        echo "=== Health check ==="
        curl -f http://localhost:9009/health || exit 1

        echo "Production deployment of $CI_COMMIT_TAG successful!"
      ENDSSH
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/
  when: manual

stop:production:
  extends: .deploy_template
  environment:
    name: production
    action: stop
  script:
    - ssh $SSH_USER@$VM_HOST "cd /opt/crypto-bot-prod && docker compose -f docker-compose.prod.yml down"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/
  when: manual


# ============================================
# STAGE: DEPLOY — Update manifests (GitOps K8s)
# ============================================
# Met a jour crypto-bot-infra/main pour declencher ArgoCD.
# Staging : annotation deployed-commit (tag :staging reste stable)
# Prod    : tag versionne + annotation

update:manifests:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build:docker
      artifacts: false
  before_script:
    - apk add --no-cache git
  script:
    - |
      SHA="${CI_COMMIT_SHORT_SHA}"
      REPO_URL="https://oauth2:${GROUP_PAT_TOKEN}@gitlab.com/dst_crypto/crypto-bot-infra.git"

      git clone --depth=1 --branch=main "${REPO_URL}" /tmp/infra
      cd /tmp/infra

      git config user.email "ci@crypto-bot.gitlab.com"
      git config user.name "GitLab CI"

      if [ -n "$CI_COMMIT_TAG" ]; then
        # --- PRODUCTION : tag versionne + annotation ---
        VERSION="${CI_COMMIT_TAG}"
        OVERLAY="overlays/prod/kustomization.yaml"

        sed -i "s|crypto-bot-app/backend:[a-zA-Z0-9._-]*|crypto-bot-app/backend:${VERSION}|g" "${OVERLAY}"
        sed -i "s|crypto-bot-app/frontend:[a-zA-Z0-9._-]*|crypto-bot-app/frontend:${VERSION}|g" "${OVERLAY}"
        sed -i 's/deployed-commit: ".*"/deployed-commit: "'"${SHA}"'"/' "${OVERLAY}"

        COMMIT_MSG="ci(gitops): production ${VERSION} (${SHA})"

      else
        # --- STAGING : annotation seule (tag :staging inchange) ---
        OVERLAY="overlays/staging/kustomization.yaml"

        sed -i 's/deployed-commit: ".*"/deployed-commit: "'"${SHA}"'"/' "${OVERLAY}"

        COMMIT_MSG="ci(gitops): staging rollout ${SHA}"
      fi

      # Commit + push seulement s'il y a un diff
      git add "${OVERLAY}"
      if ! git diff --cached --quiet; then
        git commit -m "${COMMIT_MSG}"
        # Retry avec rebase si push echoue (race condition)
        git push origin main || (git pull --rebase origin main && git push origin main)
        echo "Pushed: ${COMMIT_MSG}"
      else
        echo "No changes detected — skipping"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/
