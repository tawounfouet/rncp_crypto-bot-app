# Docker Compose pour environnement PRODUCTION
# =============================================
# IMPORTANT : ne pas lancer directement avec "docker compose".
# Utiliser : make prod-up / make prod-down / make prod-config
# Ports: Backend 9009, Postgres 5435 (cohabite avec staging)

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PWD:-postgres}
      POSTGRES_DB: crypto_bot_db
    ports:
      - "5435:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - prod-network

  # PostgreSQL Admin UI (debug only — not started by default)
  adminer:
    image: ${ADMINER_IMAGE}
    container_name: prod-postgres-admin-ui
    restart: always
    ports:
      - "8086:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - debug
    networks:
      - prod-network

  minio:
    image: ${MINIO_IMAGE}
    container_name: prod-minio
    restart: always
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER_ADMIN:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PWD_ADMIN:-minioadmin}
    volumes:
      - prod_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - prod-network

  # MinIO bucket creation (one-time)
  createbuckets:
    image: ${MINIO_MC_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/crypto-bot-data;
      /usr/bin/mc anonymous set download myminio/crypto-bot-data;
      echo 'Buckets created successfully.';
      exit 0;
      "
    profiles:
      - tools
    networks:
      - prod-network

  crypto-bot-backend:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/dst_crypto/crypto-bot-app}/backend:${IMAGE_TAG:-latest}
    container_name: prod-backend
    restart: always
    ports:
      - "9009:8009"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PWD:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=crypto_bot_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=0
      - MINIO_BUCKET=crypto-bot-data
      - ENVIRONMENT=production
      - DEBUG=false
      - BINANCE_ENC_KEY=${BINANCE_ENC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - prod-network

  crypto-bot-frontend:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/dst_crypto/crypto-bot-app}/frontend:${IMAGE_TAG:-latest}
    container_name: prod-frontend
    restart: always
    ports:
      - "8502:8501"
    environment:
      - API_URL=http://crypto-bot-backend:8009
      - ENVIRONMENT=production
      - APP_VERSION=${APP_VERSION:-latest}
    depends_on:
      crypto-bot-backend:
        condition: service_healthy
    networks:
      - prod-network

volumes:
  prod_postgres_data:
  prod_minio_data:

networks:
  prod-network:
    name: prod-network
