# See https://pre-commit.com for more information
exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false

repos:
  # Hooks generiques
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ".*\\.md$|^ci/test-results/"
      - id: end-of-file-fixer
        exclude: "^ci/test-results/"
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements

  # Ruff (remplace black + flake8 + isort + bandit)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff linter"
        args: ["--fix"]
        files: ^(backend|frontend)/src/
      - id: ruff-format
        name: "Run ruff formatter"
        files: ^(backend|frontend)/src/

  # Semgrep securite
  - repo: https://github.com/semgrep/semgrep
    rev: v1.156.0
    hooks:
      - id: semgrep
        name: "Semgrep security scan"
        args: ['--config', '.semgrep/security.yml', '--error']
        types_or: [python]

  # Hooks locaux
  - repo: local
    hooks:
      - id: check-infra
        name: "Check Docker/Makefile infrastructure"
        entry: scripts/check-infra.sh
        language: script
        files: '(Dockerfile|docker-compose.*\.yml|Makefile|versions\.env|requirements.*\.txt|pyproject\.toml)'
        pass_filenames: false

      - id: run-tests
        name: "Run lint + tests for changed code"
        entry: scripts/run-tests-if-needed.sh
        language: script
        files: '^(backend|frontend)/src/.*\.py$'
        pass_filenames: false

ci:
  skip: [check-infra, run-tests]
